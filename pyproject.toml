[project]
name = "llm-serving-benchmark"
version = "0.1.0"
description = "OpenAI-compatible LLM serving benchmark harness for vLLM, SGLang, llama.cpp and others"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "tiktoken>=0.7",
]

[project.scripts]
llm-bench = "benchmark.bench_openai:main"

[tool.setuptools]
packages = ["benchmark"]
